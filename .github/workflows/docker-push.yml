# ============================================================
# Build image produksi Portal ASN → GitHub Container Registry
#
# Push ke `main` → image `:main` → watchtower di LXC 142 (shared-apps)
# menariknya dalam ±1 menit dan mengganti `asn-portal-app`.
# Migrasi dijalankan entrypoint saat container hidup, dengan syarat
# RUN_MIGRATIONS=true di .env server — tanpa itu deploy "sukses" sementara
# skema tertinggal.
#
# Image ini TIDAK membawa konfigurasi apa pun: kredensial DB, Keycloak,
# dan WA gateway dibaca saat runtime dari `.env` server. Jangan menambah
# build-args berisi rahasia — isinya tertanam permanen di image.
#
# Gerbang mutu saat ini hanya build yang berhasil (composer install, Vite,
# seluruh stage Dockerfile). Tes PHPUnit butuh MySQL `testing` — menyusul.
# ============================================================

name: Build & Push Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4


      - uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
