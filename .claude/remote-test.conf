HOST=pemda-test
MODE=docker
# Same PHP minor as deploy/Dockerfile. The bare image has no composer or unzip, so the command adds them.
IMAGE=php:8.3-cli-alpine
# No .env is shipped, so the command makes one from .env.example.
CMD=apk add --no-cache unzip >/dev/null && php -r "copy('https://getcomposer.org/installer','/tmp/ci.php');" && php /tmp/ci.php --quiet --install-dir=/tmp && php /tmp/composer.phar install --no-interaction --prefer-dist --no-progress && cp -n .env.example .env && php artisan key:generate --force && php artisan test
EXCLUDE=node_modules vendor preview
